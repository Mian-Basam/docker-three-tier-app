name: taskboard

services:
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: taskboard-web:${APP_VERSION:-local}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: taskboard-api:${APP_VERSION:-local}
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-taskboard}
      DB_USER: ${DB_USER:-taskboard}
      DB_PASSWORD_FILE: /run/secrets/db_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskboard}
      POSTGRES_USER: ${DB_USER:-taskboard}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    ports: ["8081:8080"]
    networks: [backend, frontend]

networks:
  frontend: {}
  backend:
    internal: true        # the database has no route to the outside world

volumes:
  pgdata: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
